name: CI-CD PIPELINE

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests-and-validation:
    name: Tests and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest when tests exist
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            pytest tests -v
          else
            echo "No tests directory found, skipping pytest."
          fi

      - name: Compile-check Python source
        run: |
          python -m compileall app.py services scripts prompts

      - name: Build Docker image (smoke test)
        run: |
          docker build -t aicare:ci .

  build-and-push-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: tests-and-validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # Required repository variables/secrets:
    # Variables:
    # - DOCKERHUB_NAMESPACE        e.g. axbouf
    # - DOCKERHUB_REPOSITORY       e.g. zenith
    # - DOCKERHUB_USERNAME
    # Secrets:
    # - DOCKERHUB_PASSWORD
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
