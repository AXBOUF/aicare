{% extends 'base.html' %}

{% block title %}Log in — Zenith Healthcare{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    {% if user_count == 0 %}
    <div class="alert alert-info">
      <strong>👋 Welcome!</strong> No users exist yet. <a href="{{ url_for('setup_first_user') }}" class="alert-link">Create the first admin account →</a>
    </div>
    {% endif %}

    <div class="card">
      <div class="card-body">
        <h3 class="card-title">Sign in</h3>
        <p class="text-muted">Access clinical records and admin features.</p>
        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
